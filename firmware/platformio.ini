[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D USB_MIDI_SERIAL
    -D TEENSY_OPT_FASTER
monitor_speed = 115200

; Prueba del DAC (seno 440 Hz). No forma parte del firmware principal.
[env:test_dac]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D USB_MIDI_SERIAL
    -D TEENSY_OPT_FASTER
build_src_filter = -<*> +<../tools/dac_tone/dac_tone.cpp>
monitor_speed = 115200
